# Render Blueprint for QKash.
#
# Builds the repository Dockerfile. The audited CSV is tracked in this private
# repository, so the build context carries it; a container filesystem is not
# browsable, so the data is not exposed by the public app URL.
services:
  - type: web
    name: qkash
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /_stcore/health
    autoDeploy: false
    envVars:
      # Set the value in the Render dashboard; never commit it.
      - key: QBRAID_API_KEY
        sync: false
      - key: QKASH_USE_QBRAID
        value: "false"
